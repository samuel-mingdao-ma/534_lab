<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f4">
  <meta name="description" content="查看全球每日参考汇率、30/90 天历史走势，并轻松换算常用货币。由 Frankfurter 开放数据支持。">
  <title>汇率观察 · 全球汇率仪表盘</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%231c6552'/%3E%3Cpath d='M10 15h20l-5-5m5 15H10l5 5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="./" aria-label="汇率观察首页">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 8h16l-4-4M20 16H4l4 4"/></svg></span>
        <span>汇率观察<span class="brand-english">EXCHANGE / 534</span></span>
      </a>
      <a class="source-link" href="https://frankfurter.dev/" target="_blank" rel="noopener noreferrer">数据来自 Frankfurter <span aria-hidden="true">↗</span></a>
    </header>

    <main>
      <section class="page-heading" aria-labelledby="page-title">
        <div>
          <div class="eyebrow"><span class="status-dot" aria-hidden="true"></span> DAILY REFERENCE RATES</div>
          <h1 id="page-title">全球汇率，一目了然<span class="title-dot">。</span></h1>
          <p class="intro">查看每日汇率，比较历史走势，轻松换算金额。</p>
        </div>
        <div class="base-control">
          <label for="base-currency">基准货币</label>
          <select id="base-currency" name="base-currency"></select>
        </div>
      </section>

      <div id="notice" class="notice" role="status" hidden></div>

      <section class="rates-section" aria-label="常用货币参考汇率">
        <div class="section-meta"><span>每 <strong id="base-label">1 USD</strong> 可兑换</span><span>选择货币查看走势 <span aria-hidden="true">↘</span></span></div>
        <div id="rate-list" class="rate-list" aria-busy="true"></div>
      </section>

      <div class="workspace">
        <section class="history-panel" aria-labelledby="history-title">
          <div class="panel-heading">
            <h2 id="history-title">汇率走势</h2>
            <div class="period-control" role="group" aria-label="历史区间">
              <button type="button" data-days="30" aria-pressed="true">30 天</button>
              <button type="button" data-days="90" aria-pressed="false">90 天</button>
            </div>
          </div>
          <div class="pair-summary">
            <div>
              <label class="pair-label" for="chart-currency"><span id="chart-base">USD</span><span aria-hidden="true"> / </span><select id="chart-currency" name="chart-currency" aria-label="走势图目标货币"></select></label>
              <div class="pair-number"><span id="pair-rate">—</span><span id="pair-unit">CNY</span></div>
            </div>
            <div class="change-summary"><span id="period-change">—</span><span id="change-label">近 30 天变化</span></div>
          </div>
          <div id="chart-region" class="chart-region" aria-busy="true">
            <div id="chart-interaction" class="chart-interaction" tabindex="0" role="group" aria-label="历史汇率图表" aria-describedby="chart-help">
              <svg id="chart" viewBox="0 0 760 310" role="img" aria-labelledby="chart-title chart-description">
                <title id="chart-title">USD 对 CNY 的历史汇率</title>
                <desc id="chart-description">正在加载历史汇率。</desc>
              </svg>
              <div id="chart-tooltip" class="chart-tooltip" hidden></div>
            </div>
            <span id="chart-announcement" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></span>
            <div id="chart-message" class="chart-message" role="status"><span class="spinner" aria-hidden="true"></span><span>正在获取历史汇率…</span></div>
          </div>
          <div class="chart-caption"><span id="chart-date-range">—</span><span id="chart-help">悬停或使用 ← → 查看每日汇率</span></div>
          <div class="history-stats" aria-label="所选区间统计">
            <div><span>区间最低</span><strong id="range-low">—</strong></div>
            <div><span>区间最高</span><strong id="range-high">—</strong></div>
            <div><span>区间均值</span><strong id="range-average">—</strong></div>
          </div>
        </section>

        <section class="converter-panel" aria-labelledby="converter-title">
          <div class="panel-heading"><h2 id="converter-title">货币换算</h2><svg class="small-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16l-4-4M20 16H4l4 4"/></svg></div>
          <form id="converter-form" novalidate>
            <label class="field-label" for="amount">换算金额</label>
            <div class="amount-field"><input id="amount" name="amount" type="number" inputmode="decimal" min="0" max="1000000000000" step="any" value="100" aria-describedby="amount-error"><span id="amount-currency">USD</span></div>
            <p id="amount-error" class="field-error" role="status" hidden></p>
            <div class="currency-fields">
              <div><label class="field-label" for="from-currency">从</label><select id="from-currency" name="from-currency"></select></div>
              <button type="button" id="swap-currencies" class="swap-button" aria-label="交换源货币和目标货币" title="交换货币"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16l-4-4M20 16H4l4 4"/></svg></button>
              <div><label class="field-label" for="to-currency">至</label><select id="to-currency" name="to-currency"></select></div>
            </div>
            <div class="conversion-result" role="status" aria-live="polite" aria-atomic="true">
              <span class="result-label">换算结果</span>
              <div><output id="converted-amount" for="amount from-currency to-currency">—</output><span id="result-currency">CNY</span></div>
              <span id="conversion-rate" class="conversion-rate">正在获取参考汇率…</span>
            </div>
          </form>
          <p class="converter-note"><span aria-hidden="true">ⓘ</span> 按每日参考汇率估算，不含银行点差及手续费。</p>
        </section>
      </div>

      <footer class="page-footer">
        <div><span class="status-dot" id="footer-dot" aria-hidden="true"></span><span id="data-date" role="status">正在连接数据源…</span><span class="footer-separator">/</span><span>每日参考汇率</span></div>
        <button id="refresh" class="refresh-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 6.1A8 8 0 0 1 20 12M4 12a8 8 0 0 0 13.9 5.9"/></svg><span>刷新数据</span></button>
      </footer>
    </main>
    <div class="bottom-note"><span>汇率观察</span><span>公开数据 · 无需账户</span></div>
  </div>
  <noscript><p class="noscript">请启用 JavaScript，以获取汇率和使用换算功能。</p></noscript>
</body>
</html>
